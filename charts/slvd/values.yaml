# SLVD chart values. The 'secrets' block below holds sensitive values: keep the
# committed defaults EMPTY. Real values are injected at deploy time via the
# EzAppConfig 'values' block (charts/slvd/ezappconfig.generated.yaml, gitignored).
global:
  namespace: slvd
  imageRegistry: docker.io/eric021122
  imageTag: "0.1.0"

# External hosts (Istio VirtualService on istio-system/ezaf-gateway).
# ${DOMAIN_NAME} is substituted by the EzAppConfig controller at deploy time
# (e.g. your-domain.com), so the same chart adapts to any PCAI deployment.
ingress:
  host: slvd.${DOMAIN_NAME}
  mailHost: slvd-mail.${DOMAIN_NAME}

# HPE EZUA — required for the EzAppConfig controller to register the app on
# the PCAI UI (virtualService endpoint + gateway + hpe-ezua pod labels).
ezua:
  appName: slvd
  type: vendor-service
  virtualService:
    endpoint: "slvd.${DOMAIN_NAME}"
    mailEndpoint: "slvd-mail.${DOMAIN_NAME}"
    istioGateway: "istio-system/ezaf-gateway"

portal:
  image:
    repository: slvd-portal
    tag: "0.3.6"
    pullPolicy: IfNotPresent
  port: 80
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 128Mi }

engine:
  image:
    repository: slvd
    tag: "0.3.1"
    pullPolicy: IfNotPresent
  port: 8080
  env:
    # agent backend: stub (sim) | direct_llm (real) | openclaw (NemoClaw runtime on PCAI)
    SLVD_AGENT_BACKEND: "openclaw"
    # NemoClaw/OpenClaw gateway (WS): engine -> agent turn (method=agent)
    # fallback only — the chart auto-detects the real nemoclaw-openclaw
    # Service FQDN in-cluster at install time and overrides this when found
    SLVD_OPENCLAW_URL: "ws://nemoclaw-openclaw.nemoclaw.svc:80"
    SLVD_SIMULATION: "0"
    SLVD_LLM_BASE_URL: "http://litellm-helm.project-user-aieadmin.svc.cluster.local:4000/v1"
    SLVD_LLM_MODEL: "qwen3-8-27b-int4-dflash2-r2"
    SLVD_LLM_TIMEOUT_S: "300"
    SLVD_APPROVER_EMAIL: "Sarah.Chen@mybank.com"
    SLVD_CLIENT_EMAIL: "client@acme-industrial.example"
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

mcp:
  image:
    repository: slvd
    tag: "0.3.1"
    pullPolicy: IfNotPresent
  port: 8000
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 128Mi }

mailpit:
  image:
    registry: docker.io
    repository: axllent/mailpit
    tag: "v1.21.0"
    pullPolicy: IfNotPresent
  smtpPort: 1025
  uiPort: 8025
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 128Mi }

# Secrets — the UI form may be left COMPLETELY EMPTY (zero-input deploy):
#   litellmApiKey  auto-detected from the in-cluster litellm-helm-masterkey Secret
#   openclawToken  auto-detected from NemoClaw's openclaw.json ConfigMap
#   jwtSecret      deterministic sha256(release coords) when empty
#   hmacSecret     deterministic sha256(release coords) when empty
# Any non-empty value entered in the form always overrides auto-detection.
# No K8s Secret objects — plain env vars only.
secrets:
  litellmApiKey: ""
  jwtSecret: ""
  hmacSecret: ""
  openclawToken: ""

persistence:
  enabled: true
  size: 1Gi
  storageClass: ""   # empty = default (nfs-csi on CS1)
