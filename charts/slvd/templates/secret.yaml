apiVersion: v1
kind: Secret
metadata:
  name: slvd-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "slvd.labels" . | nindent 4 }}
type: Opaque
stringData:
  litellm-api-key: {{ .Values.secrets.litellmApiKey | quote }}
  jwt-secret: {{ .Values.secrets.jwtSecret | quote }}
  hmac-secret: {{ .Values.secrets.hmacSecret | quote }}
  openclaw-token: {{ .Values.secrets.openclawToken | quote }}
