apiVersion: apps/v1
kind: Deployment
metadata:
  name: engine
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "slvd.labels" . | nindent 4 }}
    app: engine
spec:
  replicas: 1
  selector:
    matchLabels: { app: engine }
  template:
    metadata:
      labels:
        {{- include "slvd.labels" . | nindent 8 }}
        {{- include "hpe-ezua.labels" . | nindent 8 }}
        app: engine
      annotations:
        sidecar.istio.io/inject: "true"
        # Bypass sidecar interception for SMTP (1025): plain SMTP is not
        # TLS and the sidecar would sniff it as HTTP, breaking the
        # engine -> mailpit handshake.
        traffic.sidecar.istio.io/excludeOutboundPorts: "1025"
    spec:
      containers:
        - name: engine
          image: {{ .Values.global.imageRegistry }}/{{ .Values.engine.image.repository }}:{{ .Values.engine.image.tag }}
          imagePullPolicy: {{ .Values.engine.image.pullPolicy }}
          command: ["/app/run-engine.sh"]
          ports: [{ containerPort: 8080 }]
          env:
            - name: SLVD_DATA_DIR
              value: /data
            - name: SLVD_MCP_BASE_URL
              value: http://credit-memo-mcp.{{ .Values.global.namespace }}.svc:8000
            - name: SLVD_MAIL_HOST
              value: mailpit.{{ .Values.global.namespace }}.svc
            - name: SLVD_MAIL_PORT
              value: "1025"
            - name: SLVD_BASE_URL
              value: https://{{ .Values.ingress.host }}
            {{- range $k, $v := .Values.engine.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            - name: SLVD_LLM_API_KEY
              valueFrom: { secretKeyRef: { name: slvd-secrets, key: litellm-api-key } }
            - name: SLVD_JWT_SECRET
              valueFrom: { secretKeyRef: { name: slvd-secrets, key: jwt-secret } }
            - name: SLVD_HMAC_SECRET
              valueFrom: { secretKeyRef: { name: slvd-secrets, key: hmac-secret } }
            - name: SLVD_MCP_INTERNAL_TOKEN
              valueFrom: { secretKeyRef: { name: slvd-secrets, key: hmac-secret } }
            - name: SLVD_OPENCLAW_TOKEN
              valueFrom: { secretKeyRef: { name: slvd-secrets, key: openclaw-token } }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources: {{- toYaml .Values.engine.resources | nindent 12 }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: /data
          {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: slvd-data
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: engine
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "slvd.labels" . | nindent 4 }}
    app: engine
spec:
  selector: { app: engine }
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
